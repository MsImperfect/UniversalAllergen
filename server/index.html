<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeBite | Universal Allergen & Diet Scanner</title>
    <meta
        name="description"
        content="SafeBite helps users set dietary restrictions, scan products, and check live ingredient data against allergy and diet rules."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="root"></div>

    <noscript>SafeBite needs JavaScript enabled to run the React interface.</noscript>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module">
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import {
            createUserWithEmailAndPassword,
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            signOut,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        window.SafeBiteFirebase = {
            initializeApp,
            getApp,
            getApps,
            getAuth,
            onAuthStateChanged,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            updateProfile
        };
    </script>
    <script type="text/babel" data-presets="react" src="/script.js"></script>
</body>
</html>
